version: '3.8'

services:
  basededatos:
    image: mongo:latest
    container_name: mi_mongo_local
    ports:
      - "27017:27017"
    volumes:
      - ./mongo-data:/data/db

  app:
    build: .
    container_name: pdf_extractor_app
    depends_on:
      - basededatos
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000